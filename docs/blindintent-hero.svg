<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" role="img" aria-label="BlindIntent — Post-Quantum Sealed Intent and Bounded Agent Protocol on QoreChain">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090C"/>
      <stop offset="55%" stop-color="#0B1119"/>
      <stop offset="100%" stop-color="#07090C"/>
    </linearGradient>
    <radialGradient id="tealAura" cx="22%" cy="46%" r="48%">
      <stop offset="0%" stop-color="#00D4B8" stop-opacity="0.24"/>
      <stop offset="55%" stop-color="#00D4B8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#00D4B8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberAura" cx="84%" cy="22%" r="38%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="58%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#00D4B8"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1D2635" stroke-width="0.7" stroke-opacity="0.45"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .flow-dash {
        stroke-dasharray: 6 6;
        animation: dashMove 2.6s linear infinite;
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -24; }
      }
    </style>
  </defs>

  <rect x="2" y="2" width="1196" height="336" rx="18" fill="url(#bgGrad)" stroke="#1D2635" stroke-width="1.5"/>
  <rect x="2" y="2" width="1196" height="336" rx="18" fill="url(#grid)"/>
  <rect x="2" y="2" width="1196" height="336" rx="18" fill="url(#tealAura)"/>
  <rect x="2" y="2" width="1196" height="336" rx="18" fill="url(#amberAura)"/>
  <line x1="48" y1="2" x2="430" y2="2" stroke="#00D4B8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Left Visual Card: Sealed Intent Vault Flow -->
  <g transform="translate(50, 42)">
    <rect x="0" y="0" width="296" height="256" rx="14" fill="#0D1117" fill-opacity="0.94" stroke="#1D2635" stroke-width="1.2"/>
    <text x="16" y="24" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1.1">SEALED INTENT &amp; PQC ENVELOPE</text>
    <circle cx="274" cy="20" r="4" fill="#00D4B8"/>

    <!-- Sealed Strategy Box -->
    <rect x="18" y="42" width="260" height="44" rx="8" fill="#131922" stroke="#00D4B8" stroke-width="1.4" filter="url(#glow)"/>
    <text x="30" y="61" fill="#5EEAD4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">QoreSeal · ML-KEM-1024</text>
    <text x="30" y="77" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">Trigger &amp; Slippage: HIDDEN</text>

    <!-- Connector -->
    <path d="M 148 86 L 148 112" fill="none" stroke="#00D4B8" stroke-width="2" class="flow-dash"/>

    <!-- Bounded Agent Box -->
    <rect x="18" y="112" width="260" height="44" rx="8" fill="#131922" stroke="#F59E0B" stroke-width="1.3"/>
    <text x="30" y="131" fill="#FBBF24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">MsgExecuteEVM · Caps</text>
    <text x="30" y="147" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">perTx · Daily · Vault Whitelist</text>

    <!-- Connector -->
    <path d="M 148 156 L 148 182" fill="none" stroke="#F59E0B" stroke-width="2" class="flow-dash"/>

    <!-- Precompile Check Box -->
    <rect x="18" y="182" width="260" height="44" rx="8" fill="#042F2E" stroke="#00D4B8" stroke-width="1.4"/>
    <text x="30" y="201" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">Solidity 0x...0a01 pqcVerify</text>
    <text x="30" y="217" fill="#5EEAD4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">ML-DSA-87 Commit + x/amm Swap</text>

    <text x="148" y="244" text-anchor="middle" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">QoreChain qorechain-diana · EVM 9800</text>
  </g>

  <!-- Right Main Content -->
  <g transform="translate(382, 52)">
    <rect x="0" y="0" width="465" height="28" rx="14" fill="#131922" stroke="#1D2635" stroke-width="1.2"/>
    <circle cx="16" cy="14" r="4" fill="#00D4B8"/>
    <text x="29" y="18" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="0.7">BUILD BEFORE Q-DAY  •  POST-QUANTUM AI AGENTS</text>

    <text x="0" y="96" fill="url(#titleGrad)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="68" font-weight="800" letter-spacing="-1.5">BlindIntent</text>

    <text x="2" y="132" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="19" font-weight="500">
      MEV-Proof Post-Quantum Sealed Intents Executed by Policy-Capped AI Agents
    </text>
    <text x="2" y="159" fill="#64748B" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="15">
      Zero plaintext triggers in mempool. Hard chain caps via MsgExecuteEVM + Solidity precompile 0x...0a01.
    </text>

    <g transform="translate(0, 186)">
      <rect x="0" y="0" width="180" height="58" rx="10" fill="#0D1117" stroke="#1D2635" stroke-width="1.2"/>
      <text x="14" y="23" fill="#00D4B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="700">ML-KEM-1024</text>
      <text x="14" y="43" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11.5">QoreSeal Dark Orders</text>

      <rect x="194" y="0" width="186" height="58" rx="10" fill="#0D1117" stroke="#1D2635" stroke-width="1.2"/>
      <text x="208" y="23" fill="#FBBF24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="700">MsgExecuteEVM</text>
      <text x="208" y="43" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11.5">Scoped Agent Guardrails</text>

      <rect x="394" y="0" width="182" height="58" rx="10" fill="#0D1117" stroke="#1D2635" stroke-width="1.2"/>
      <text x="408" y="23" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="700">0x...0a01 / 0a02</text>
      <text x="408" y="43" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11.5">On-Chain ML-DSA Verify</text>

      <rect x="590" y="0" width="176" height="58" rx="10" fill="#0D1117" stroke="#1D2635" stroke-width="1.2"/>
      <text x="604" y="23" fill="#FB7185" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="700">Attack Lab</text>
      <text x="604" y="43" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11.5">Live Fail-Closed Proofs</text>
    </g>
  </g>
</svg>
